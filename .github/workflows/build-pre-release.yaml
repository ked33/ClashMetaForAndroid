name: Build Pre-Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
      - "PRIVACY_POLICY.md"

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  BuildPreRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"
          cache: false

      - name: Apply Patches
        run: |
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --verbose -p 1 < "$p"
          done

      - name: Cache Go build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Android SDK / NDK
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
          key: ${{ runner.os }}-android-sdk-ndk29-cmake-${{ hashFiles('**/build.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-ndk29-
            ${{ runner.os }}-android-sdk-

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Prepare app config (arm64-only + custom package)
        run: |
          cat > local.properties <<'EOF'
          custom.application.id=com.ked33.clash
          remove.suffix=true
          abi.filters=arm64-v8a
          EOF
          # strip leading spaces from heredoc indentation
          sed -i 's/^[[:space:]]*//' local.properties
          echo "local.properties:"
          cat local.properties

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secrets. Required: KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          test -s release.keystore
          {
            echo "keystore.path=release.keystore"
            echo "keystore.password=${SIGNING_STORE_PASSWORD}"
            echo "key.alias=${SIGNING_KEY_ALIAS}"
            echo "key.password=${SIGNING_KEY_PASSWORD}"
          } > signing.properties
          echo "Signing materials prepared (passwords not printed)."

      - name: Pre-release Build (arm64-v8a only)
        run: ./gradlew --no-daemon --build-cache app:assembleAlphaRelease

      - name: Collect arm64 APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/alpha/release/*.apk | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Delete old Prerelease-alpha
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Prerelease-alpha
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: Prerelease-alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Alpha to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Prerelease-alpha
          name: Pre-Release (arm64-v8a)
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
          generate_release_notes: true
          body: |
            Automated pre-release build (signed, **arm64-v8a only**).
            Package ID: `com.ked33.clash`
