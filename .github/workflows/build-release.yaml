name: Build Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "fastlane/**"
      - ".gitignore"
      - "LICENSE"
      - "NOTICE"
      - "PRIVACY_POLICY.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Release Tag (v2.x.x). Leave empty on manual run to auto-version."
        required: false
        default: ""

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: "https://github.com/MetaCubeX/go/releases/download/build"
          go-version: "1.26"
          cache: false

      - name: Apply Patches
        run: |
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --verbose -p 1 < "$p"
          done

      - name: Cache Go build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Android SDK / NDK
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/platforms
          key: ${{ runner.os }}-android-sdk-ndk29-cmake-${{ hashFiles('**/build.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-ndk29-
            ${{ runner.os }}-android-sdk-

      - name: Resolve version
        id: process-version
        run: |
          set -euo pipefail
          BASE_NAME=$(grep -E '^\s*versionName\s*=' build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          BASE_CODE=$(grep -E '^\s*versionCode\s*=' build.gradle.kts | head -n1 | sed -E 's/[^0-9]//g')
          INPUT_TAG="${{ github.event.inputs.release-tag }}"

          if [ -n "${INPUT_TAG:-}" ]; then
            VERSION_TAG=${INPUT_TAG#v}
            IFS='.' read -ra VERSION_PARTS <<< "$VERSION_TAG"
            VERSION_CODE=$(printf "%1d%02d%03d" "${VERSION_PARTS[0]}" "${VERSION_PARTS[1]}" "${VERSION_PARTS[2]}")
            VERSION_NAME="$VERSION_TAG"
            RELEASE_TAG="v${VERSION_NAME}"
            COMMIT_BUMP=true
          else
            # push / 手动空 tag：正式 meta 版，versionCode 用 run_number 保证可覆盖更新
            VERSION_NAME="${BASE_NAME}.${GITHUB_RUN_NUMBER}"
            VERSION_CODE=$((BASE_CODE * 1000 + GITHUB_RUN_NUMBER))
            RELEASE_TAG="v${VERSION_NAME}"
            COMMIT_BUMP=false
          fi

          echo "versonName=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "versonCode=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "releaseTag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commitBump=$COMMIT_BUMP" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME versionCode=$VERSION_CODE tag=$RELEASE_TAG"

      - name: Re-write version
        uses: Devofure/advance-android-version-actions@v1.5
        with:
          gradlePath: build.gradle.kts
          versionCode: ${{ steps.process-version.outputs.versonCode }}
          versionName: ${{ steps.process-version.outputs.versonName }}

      - name: Commit and push version bump (manual tagged release only)
        if: steps.process-version.outputs.commitBump == 'true'
        run: |
          changes=$(git diff --name-only | wc -l)
          if [ "$changes" -gt 0 ]; then
            newVersionName=${{ steps.process-version.outputs.versonName }}
            newVersionCode=${{ steps.process-version.outputs.versonCode }}
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            git add build.gradle.kts
            git commit -m "Bump version to $newVersionName ($newVersionCode)"
            git tag "${{ steps.process-version.outputs.releaseTag }}"
            git push --follow-tags
          fi

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Prepare app config (arm64-only, official package id)
        run: |
          # Official Meta package: com.github.metacubex.clash.meta
          # (base id + meta flavor suffix; do NOT set custom.application.id / remove.suffix)
          printf '%s\n' \
            'abi.filters=arm64-v8a' \
            > local.properties
          cat local.properties

      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing signing secrets. Required: KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          test -s release.keystore
          {
            echo "keystore.path=release.keystore"
            echo "keystore.password=${SIGNING_STORE_PASSWORD}"
            echo "key.alias=${SIGNING_KEY_ALIAS}"
            echo "key.password=${SIGNING_KEY_PASSWORD}"
          } > signing.properties
          echo "Signing materials prepared (passwords not printed)."

      - name: Release Build (meta / arm64-v8a only)
        run: ./gradlew --no-daemon --build-cache app:assembleMetaRelease

      - name: Collect arm64 APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(ls -1 app/build/outputs/apk/meta/release/*.apk | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Delete legacy Prerelease-alpha (cleanup)
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: Prerelease-alpha
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true

      - name: Upload formal Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.process-version.outputs.releaseTag }}
          name: Release ${{ steps.process-version.outputs.releaseTag }} (arm64-v8a)
          files: ${{ steps.apk.outputs.path }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            Formal **meta** release (signed, **arm64-v8a only**).
            - Package ID: `com.github.metacubex.clash.meta` (same as upstream; does not coexist)
            - versionName: `${{ steps.process-version.outputs.versonName }}`
            - versionCode: `${{ steps.process-version.outputs.versonCode }}`
